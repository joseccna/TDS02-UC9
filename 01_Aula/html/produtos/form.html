<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Produtos</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <script src="../../js/config.js"></script>
    <script src="../../js/produtos/form.js" defer></script>
  </head>
  <body>
    <h1>Controle de Estoque</h1>

    <header>
      <h1>Controle de Estoque</h1>

      <nav>
        <a href="../../html/index.html">Home</a>
        <a href="indesx.html">Produtos</a>
        <a href="../fornecedores/index.html">Fornecedores</a>
        <a href="#">Contas a Receber</a>
        <a href="#">Pedidos</a>
        <a href="#">Usuários</a>
      </nav>
    </header>

    <main>
      <h2 id="titulo-pagina">Novo Produto</h2>

      <form id="form-produto">
        <label for="">Nome do Produto:</label>
        <input type="text" id="nome" required />

        <label for="">Preço:</label>
        <input type="number" id="preco" min="0" step="0.01" required />

        <label for="">Quantidade em Estoque:</label>
        <input type="number" id="quantidadedestoque" min="0" required />

        <label for="">ID do Fornecedor:</label>
        <input type="number" id="fornecedorid" min="1" required />

        <button type="submit">Salvar</button>
        <a href="indesx.html" class="button" style="background-color: gray"
          >Voltar</a
        >
      </form>
    </main>
  </body>
</html>
